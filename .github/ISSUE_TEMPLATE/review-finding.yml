name: 코드 리뷰 지적
description: 코드 리뷰의 지적 하나와 그 판정. 칸은 리뷰 원본 JSON의 필드와 같고, 판정과 확인한 테스트가 더해진다.
labels: ["review-finding"]
body:
  - type: markdown
    attributes:
      value: |
        코드 리뷰 원본(`Docs/Reviews/*.json`)의 지적 하나를 옮긴다. 모든 지적이 이슈가 되고, 판정은 라벨로도 붙인다.
        reproduced만 열어 두고, 나머지는 판정과 함께 닫는다. `Tools/ReviewIssues/review_issue.py`가 같은 모양의 본문을 만든다.
        분류, 심각도, 리뷰어 확신의 값별 정의는 `Tools/CodeReview/review.workflow.js`의 스키마에 있다.
  - type: input
    id: source
    attributes:
      label: 출처
      description: 리뷰 원본 JSON의 경로와 지적 번호(원본에 나오는 순서, 1부터). 지적 번호는 원본이 든 커밋의 그 지적 줄로 링크한다
      placeholder: Docs/Reviews/2026-11-14-game-code-review.json 지적 15
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 위치
      description: JSON의 file과 line. 리뷰한 커밋의 그 줄로 링크한다
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 분류
      description: JSON의 category
      options:
        - bug
        - inconsistency
        - rule
        - cleanup
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: JSON의 severity
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: 리뷰어 확신
      description: JSON의 confidence. 리뷰 에이전트가 적은 값이다
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: 판정
      description: >-
        reproduced: 실패하는 테스트로 확인한 버그(열어 둔다).
        not-reproduced: 테스트를 썼지만 통과했다(not planned로 닫는다).
        intended: 지적대로 동작하지만 의도이거나 그대로 두기로 했다(not planned로 닫는다).
        not-checked: 테스트로 확인하지 않고 넘겼다(not planned로 닫는다).
        fixed-without-test: 테스트할 동작이 없거나 판단으로 확인해 테스트 없이 고쳤다(completed로 닫는다).
      options:
        - reproduced
        - not-reproduced
        - intended
        - not-checked
        - fixed-without-test
    validations:
      required: true
  - type: textarea
    id: verdict-reason
    attributes:
      label: 판정 이유
      description: reproduced가 아니면 그렇게 판정한 이유. 누가 정했는지, 고친 커밋이 있으면 그 커밋
  - type: textarea
    id: description
    attributes:
      label: 문제
      description: JSON의 description
    validations:
      required: true
  - type: textarea
    id: failure-scenario
    attributes:
      label: 재현 상황
      description: JSON의 failureScenario
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: JSON의 evidence
    validations:
      required: true
  - type: textarea
    id: checked-test
    attributes:
      label: 확인한 테스트
      description: 판정 커밋(리뷰 원본과 테스트를 올린 커밋)의 테스트 메서드 줄 링크와 결과 메시지. reproduced는 실패, not-reproduced는 통과이고, not-reproduced는 다음 커밋에서 지우므로 테스트 코드를 접어서도 붙인다. 나머지는 비운다
  - type: input
    id: related
    attributes:
      label: 관련 지적
      description: 같은 뿌리라 이 이슈로 함께 다루는 다른 지적 번호. 출처처럼 원본의 그 지적 줄로 링크한다. 없으면 비운다
