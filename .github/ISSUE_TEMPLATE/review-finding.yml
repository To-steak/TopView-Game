name: 코드 리뷰 지적
description: 코드 리뷰의 지적 중 테스트로 재현한 버그. 칸은 리뷰 원본 JSON의 필드와 같다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        코드 리뷰 원본(`Docs/Reviews/*.json`)의 지적 하나를 옮긴다. 그 버그로 실패하는 테스트가 있어야 연다.
        `Tools/ReviewIssues/review_issue.py`가 같은 모양의 본문을 만든다.
  - type: input
    id: source
    attributes:
      label: 출처
      description: 리뷰 원본 JSON의 경로와 지적 번호(원본에 나오는 순서, 1부터). 지적 번호는 원본이 든 커밋의 그 지적 줄로 링크한다
      placeholder: Docs/Reviews/2026-11-14-game-code-review.json 지적 15
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 위치
      description: JSON의 file과 line. 리뷰한 커밋의 그 줄로 링크한다
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 분류
      description: JSON의 category
      options:
        - bug
        - inconsistency
        - rule
        - cleanup
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: JSON의 severity
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: 리뷰어 확신
      description: JSON의 confidence. 리뷰 에이전트가 적은 값이다
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 문제
      description: JSON의 description
    validations:
      required: true
  - type: textarea
    id: failure-scenario
    attributes:
      label: 재현 상황
      description: JSON의 failureScenario
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: JSON의 evidence
    validations:
      required: true
  - type: textarea
    id: failing-test
    attributes:
      label: 실패한 테스트
      description: 고치기 전 코드에서 이 버그로 실패한 테스트와 그 실패 메시지
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: 관련 지적
      description: 같은 뿌리의 다른 지적 번호. 출처처럼 원본의 그 지적 줄로 링크한다. 없으면 비운다
